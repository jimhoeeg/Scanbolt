name: Deploy frontend to GitHub Pages

# Builds the Next.js frontend as a static, demo-mode export and publishes it to
# GitHub Pages. No backend is deployed — the site runs on mock data
# (NEXT_PUBLIC_DEMO=true, see frontend/src/lib/demoData.ts).

on:
  push:
    branches:
      - claude/machinery-ecommerce-architecture-q9szpd
      - main
  workflow_dispatch: # allow manual runs from the Actions tab

# Permissions required by the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Emits the correct base_path for a project site (e.g. "/Scanbolt")
      # and enables Next-aware Pages configuration.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Build static export (demo mode)
        run: npm run build
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_DEMO: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
